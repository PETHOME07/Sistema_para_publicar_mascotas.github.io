<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mascotas Perdidas</title>
    <script src="app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            background: linear-gradient(135deg, #001F3F 0%, #003366 50%, #004080 100%);
            padding: 12px 16px;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .btn-regresar {
            position: absolute;
            top: 12px;
            left: 12px;
            background: transparent;
            color: #FFFFFF;
            border: none;
            font-size: 1.6rem;
            padding: 0;
            border-radius: 0;
            cursor: pointer;
            transition: opacity 0.3s ease;
            z-index: 10;
            line-height: 1;
        }
        .btn-regresar:hover {
            background: transparent;
            opacity: 0.7;
            transform: none;
        }
        /* ✅ TÍTULO PERFECTAMENTE CENTRADO */
        h1 {
            text-align: center;
            color: #FFFFFF;
            font-size: clamp(1.4rem, 5vw, 2.2rem);
            margin: 35px auto 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            padding: 0 50px; /* Espacio para que no se superponga con el botón ↩️ */
            white-space: nowrap;
            width: 100%;
        }
        .mascotas-seccion {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            flex: 1;
            overflow-y: auto;
            padding: 5px 5px 20px;
            align-content: start;
        }
        .mascotas-seccion::-webkit-scrollbar {
            width: 4px;
        }
        .mascotas-seccion::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.25);
            border-radius: 2px;
        }
        .mascotas-seccion {
            scrollbar-width: thin;
            scrollbar-color: rgba(255,255,255,0.25) transparent;
        }
        .mascota-tarjeta {
            background: #FFFFFF;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0, 31, 63, 0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }
        .mascota-tarjeta:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 31, 63, 0.45);
        }
        .mascota-img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            background-color: #E6F2FF;
            display: block;
            border-bottom: 3px solid #008ecf;
        }
        .mascota-info {
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        .mascota-nombre {
            font-size: 1.2rem;
            color: #001F3F;
            margin-bottom: 0.8rem;
            font-weight: 700;
            text-align: center;
        }
        .mascota-datos {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }
        .dato-fila {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #33475B;
            font-size: 0.9rem;
            line-height: 1.4;
        }
        .icono {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0066CC;
            font-weight: bold;
            font-size: 1rem;
            flex-shrink: 0;
        }
        .btn-contactar {
            width: 200px;
            height: 42px;
            background: white;
            color: #008ecf;
            border: 2px solid #008ecf;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            margin: 0.5rem auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            text-decoration: none;
        }
        .btn-contactar:hover {
            background: #00b4d8;
            color: white;
            transform: scale(1.05);
        }
        .sin-resultados {
            text-align: center;
            color: #FFFFFF;
            font-size: 1.1rem;
            grid-column: 1 / -1;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 12px;
        }
        @media (max-width: 480px) {
            body {
                padding: 10px 12px;
            }
            h1 {
                margin-top: 35px; /* Baja el título para que no se superponga con el botón en celulares */
                font-size: 1.3rem;
                padding: 0;
            }
            .mascotas-seccion {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .mascota-img {
                height: 220px;
            }
            .btn-contactar {
                width: 100%;
                max-width: 220px;
            }
        }
        @media (min-width: 481px) and (max-width: 768px) {
            .mascotas-seccion {
                grid-template-columns: repeat(2, 1fr);
            }
            .mascota-img {
                height: 240px;
            }
        }
        @media (min-width: 769px) {
            .mascotas-seccion {
                grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            }
            .mascota-img {
                height: 260px;
            }
        }
    </style>
</head>
<body>
    <h1>🐾MASCOTAS PERDIDAS🐾</h1>
    <button class="btn-regresar" onclick="window.location.href='index.html'">↩️</button>
    <div class="mascotas-seccion" id="contenedor-mascotas">
        <!-- Aquí se cargan las tarjetas desde app.js -->
    </div>
    <script>
        if (typeof listaDePublicidades === 'function') {
            listaDePublicidades();
        } else {
            console.warn("La función listaDePublicidades no está definida en app.js");
            document.getElementById('contenedor-mascotas').innerHTML = 
                '<p class="sin-resultados">Cargando reportes...</p>';
        }
    </script>
</body>
</html>
